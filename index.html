<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Marginalia</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A daily motivational or philosophical quote, with a shuffle for another." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" />

<style>
  /* ---------- tokens: light (bare :root defines the full palette) ---------- */
  :root {
    --ground:   #E9EAE9;
    --ink:      #202127;
    --muted:    #6C6B78;
    --accent:   #4E5583;
    --rule:     rgba(32, 33, 39, 0.14);
    --rule-2:   rgba(32, 33, 39, 0.28);

    --quote-size: clamp(1.55rem, 3.3vw + 0.7rem, 3rem);
  }

  /* system-default (no data-theme stamp): only prefers-color-scheme decides */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:  #16161B;
      --ink:     #E5E3DB;
      --muted:   #8C8B99;
      --accent:  #A3A9D4;
      --rule:    rgba(229, 227, 219, 0.15);
      --rule-2:  rgba(229, 227, 219, 0.3);
    }
  }

  /* explicit toggle wins in both directions */
  :root[data-theme="dark"] {
    --ground:  #16161B;
    --ink:     #E5E3DB;
    --muted:   #8C8B99;
    --accent:  #A3A9D4;
    --rule:    rgba(229, 227, 219, 0.15);
    --rule-2:  rgba(229, 227, 219, 0.3);
  }
  :root[data-theme="light"] {
    --ground:  #E9EAE9;
    --ink:     #202127;
    --muted:   #6C6B78;
    --accent:  #4E5583;
    --rule:    rgba(32, 33, 39, 0.14);
    --rule-2:  rgba(32, 33, 39, 0.28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    min-height: 100%;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: clamp(1.75rem, 5vh, 3.5rem);
    width: min(46rem, 100%);
    margin: 0 auto;
    padding: clamp(1.6rem, 4.5vw, 3.5rem);
  }

  /* ---------- top eyebrow ---------- */
  .eyebrow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow .index { font-variant-numeric: tabular-nums; }

  /* ---------- the quote ---------- */
  figure {
    margin: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1.4rem, 3.5vh, 2.4rem);
  }

  blockquote {
    margin: 0;
    font-size: var(--quote-size);
    font-weight: 400;
    line-height: 1.28;
    letter-spacing: -0.011em;
    text-wrap: balance;
    max-width: 24ch;
  }
  blockquote::before {
    content: "\201C";
    color: var(--accent);
    margin-right: 0.06em;
  }
  blockquote::after { content: "\201D"; color: var(--accent); }

  figcaption {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.74rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  figcaption::before {
    content: "";
    width: clamp(1.5rem, 6vw, 3rem);
    height: 1px;
    background: var(--rule-2);
    flex: none;
  }

  /* enter / swap animation */
  .anim { opacity: 0; transform: translateY(0.5rem); }
  .anim.in {
    opacity: 1;
    transform: none;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .anim.out {
    opacity: 0;
    transform: translateY(-0.35rem);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }

  /* ---------- footer control ---------- */
  .foot {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  button.another {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.5rem 0.85rem;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    transition: color 0.18s ease, border-color 0.18s ease;
  }
  button.another:hover { color: var(--accent); border-color: var(--accent); }
  button.another:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.another .glyph {
    font-family: "Newsreader", serif;
    font-size: 0.95rem;
    line-height: 1;
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  button.another:hover .glyph { transform: rotate(-180deg); }

  @media (prefers-reduced-motion: reduce) {
    .anim, .anim.in, .anim.out {
      transition: opacity 0.001s linear;
      transform: none;
    }
    button.another .glyph, button.another:hover .glyph { transition: none; transform: none; }
  }

  @media (max-width: 30rem) {
    blockquote { max-width: none; }
    .eyebrow { font-size: 0.62rem; letter-spacing: 0.12em; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="eyebrow">
    <span class="date" id="date">&mdash;</span>
    <span class="index" id="index">&mdash;</span>
  </div>

  <figure aria-live="polite">
    <blockquote id="quote" class="anim">&hellip;</blockquote>
    <figcaption id="author" class="anim">&mdash;</figcaption>
  </figure>

  <div class="foot">
    <button type="button" class="another" id="another" aria-label="Show another quote">
      <span class="glyph" aria-hidden="true">&#8635;</span>
      <span>Another</span>
    </button>
  </div>
</main>

<script>
  "use strict";

  var QUOTES = [
    { t: "You have power over your mind — not outside events. Realize this, and you will find strength.", a: "Marcus Aurelius" },
    { t: "Waste no more time arguing about what a good man should be. Be one.", a: "Marcus Aurelius" },
    { t: "The impediment to action advances action. What stands in the way becomes the way.", a: "Marcus Aurelius" },
    { t: "Very little is needed to make a happy life; it is all within yourself, in your way of thinking.", a: "Marcus Aurelius" },
    { t: "The best revenge is not to be like your enemy.", a: "Marcus Aurelius" },
    { t: "Dwell on the beauty of life. Watch the stars, and see yourself running with them.", a: "Marcus Aurelius" },
    { t: "Confine yourself to the present.", a: "Marcus Aurelius" },
    { t: "If it is not right, do not do it; if it is not true, do not say it.", a: "Marcus Aurelius" },
    { t: "Loss is nothing else but change, and change is Nature's delight.", a: "Marcus Aurelius" },
    { t: "We suffer more often in imagination than in reality.", a: "Seneca" },
    { t: "It is not that we have a short time to live, but that we waste a lot of it.", a: "Seneca" },
    { t: "Difficulties strengthen the mind, as labor does the body.", a: "Seneca" },
    { t: "As long as you live, keep learning how to live.", a: "Seneca" },
    { t: "He who is brave is free.", a: "Seneca" },
    { t: "While we wait for life, life passes.", a: "Seneca" },
    { t: "It's not what happens to you, but how you react to it that matters.", a: "Epictetus" },
    { t: "No man is free who is not master of himself.", a: "Epictetus" },
    { t: "Wealth consists not in having great possessions, but in having few wants.", a: "Epictetus" },
    { t: "First say to yourself what you would be; and then do what you have to do.", a: "Epictetus" },
    { t: "A journey of a thousand miles begins with a single step.", a: "Lao Tzu" },
    { t: "When I let go of what I am, I become what I might be.", a: "Lao Tzu" },
    { t: "Nature does not hurry, yet everything is accomplished.", a: "Lao Tzu" },
    { t: "Knowing others is intelligence; knowing yourself is true wisdom.", a: "Lao Tzu" },
    { t: "The wound is the place where the Light enters you.", a: "Rumi" },
    { t: "Set your life on fire. Seek those who fan your flames.", a: "Rumi" },
    { t: "What you seek is seeking you.", a: "Rumi" },
    { t: "You were born with wings, why prefer to crawl through life?", a: "Rumi" },
    { t: "He who has a why to live for can bear almost any how.", a: "Friedrich Nietzsche" },
    { t: "You must have chaos within you to give birth to a dancing star.", a: "Friedrich Nietzsche" },
    { t: "That which does not kill us makes us stronger.", a: "Friedrich Nietzsche" },
    { t: "No price is too high to pay for the privilege of owning yourself.", a: "Friedrich Nietzsche" },
    { t: "Life can only be understood backwards; but it must be lived forwards.", a: "Søren Kierkegaard" },
    { t: "Anxiety is the dizziness of freedom.", a: "Søren Kierkegaard" },
    { t: "To dare is to lose one's footing momentarily. Not to dare is to lose oneself.", a: "Søren Kierkegaard" },
    { t: "In the depth of winter, I finally learned that within me there lay an invincible summer.", a: "Albert Camus" },
    { t: "Real generosity toward the future lies in giving all to the present.", a: "Albert Camus" },
    { t: "The struggle itself toward the heights is enough to fill a man's heart. One must imagine Sisyphus happy.", a: "Albert Camus" },
    { t: "My life has been full of terrible misfortunes, most of which never happened.", a: "Michel de Montaigne" },
    { t: "The greatest thing in the world is to know how to belong to oneself.", a: "Michel de Montaigne" },
    { t: "It's not what you look at that matters, it's what you see.", a: "Henry David Thoreau" },
    { t: "The price of anything is the amount of life you exchange for it.", a: "Henry David Thoreau" },
    { t: "Go confidently in the direction of your dreams. Live the life you have imagined.", a: "Henry David Thoreau" },
    { t: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", a: "Ralph Waldo Emerson" },
    { t: "Finish each day and be done with it. You have done what you could.", a: "Ralph Waldo Emerson" },
    { t: "Nothing great was ever achieved without enthusiasm.", a: "Ralph Waldo Emerson" },
    { t: "Be patient toward all that is unsolved in your heart and try to love the questions themselves.", a: "Rainer Maria Rilke" },
    { t: "Let everything happen to you: beauty and terror. Just keep going. No feeling is final.", a: "Rainer Maria Rilke" },
    { t: "Perhaps all the dragons in our lives are princesses who are only waiting to see us act, just once, with beauty and courage.", a: "Rainer Maria Rilke" },
    { t: "Not everything that is faced can be changed, but nothing can be changed until it is faced.", a: "James Baldwin" },
    { t: "You have to decide who you are and force the world to deal with you, not with its idea of you.", a: "James Baldwin" },
    { t: "If you want to fly, you have to give up the things that weigh you down.", a: "Toni Morrison" },
    { t: "You are your best thing.", a: "Toni Morrison" },
    { t: "When I dare to be powerful, to use my strength in the service of my vision, then it becomes less and less important whether I am afraid.", a: "Audre Lorde" },
    { t: "Caring for myself is not self-indulgence, it is self-preservation.", a: "Audre Lorde" },
    { t: "I am no longer accepting the things I cannot change. I am changing the things I cannot accept.", a: "Angela Davis" },
    { t: "You have to act as if it were possible to radically transform the world. And you have to do it all the time.", a: "Angela Davis" },
    { t: "It is good to have an end to journey toward; but it is the journey that matters, in the end.", a: "Ursula K. Le Guin" },
    { t: "Love doesn't just sit there, like a stone; it has to be made, like bread; remade all the time, made new.", a: "Ursula K. Le Guin" },
    { t: "Tell me, what is it you plan to do with your one wild and precious life?", a: "Mary Oliver" },
    { t: "Instructions for living a life: Pay attention. Be astonished. Tell about it.", a: "Mary Oliver" },
    { t: "How we spend our days is, of course, how we spend our lives.", a: "Annie Dillard" },
    { t: "Hope locates itself in the premises that we don't know what will happen and that in the spaciousness of uncertainty is room to act.", a: "Rebecca Solnit" },
    { t: "And the day came when the risk to remain tight in a bud was more painful than the risk it took to blossom.", a: "Anaïs Nin" },
    { t: "Life shrinks or expands in proportion to one's courage.", a: "Anaïs Nin" },
    { t: "All that you touch you change. All that you change changes you.", a: "Octavia E. Butler" },
    { t: "Attention is the rarest and purest form of generosity.", a: "Simone Weil" },
    { t: "The sad truth is that most evil is done by people who never make up their minds to be good or evil.", a: "Hannah Arendt" },
    { t: "Act as if what you do makes a difference. It does.", a: "William James" },
    { t: "Love is the extremely difficult realization that something other than oneself is real.", a: "Iris Murdoch" },
    { t: "Between stimulus and response there is a space. In that space is our power to choose our response.", a: "Viktor E. Frankl" },
    { t: "When we are no longer able to change a situation, we are challenged to change ourselves.", a: "Viktor E. Frankl" },
    { t: "Everything can be taken from a man but one thing: the last of the human freedoms — to choose one's attitude in any given set of circumstances.", a: "Viktor E. Frankl" },
    { t: "It does not matter how slowly you go as long as you do not stop.", a: "Confucius" },
    { t: "The man who moves a mountain begins by carrying away small stones.", a: "Confucius" },
    { t: "The unexamined life is not worth living.", a: "Socrates" },
    { t: "There is nothing permanent except change.", a: "Heraclitus" },
    { t: "No man ever steps in the same river twice.", a: "Heraclitus" },
    { t: "Character is destiny.", a: "Heraclitus" },
    { t: "Freedom is what you do with what's been done to you.", a: "Jean-Paul Sartre" },
    { t: "The limits of my language mean the limits of my world.", a: "Ludwig Wittgenstein" },
    { t: "The privilege of a lifetime is to become who you truly are.", a: "Carl Jung" },
    { t: "Until you make the unconscious conscious, it will direct your life and you will call it fate.", a: "Carl Jung" },
    { t: "Fall seven times, stand up eight.", a: "Japanese proverb" },
    { t: "The obstacle is the path.", a: "Zen proverb" }
  ];

  var qEl = document.getElementById("quote");
  var aEl = document.getElementById("author");
  var dateEl = document.getElementById("date");
  var indexEl = document.getElementById("index");
  var btn = document.getElementById("another");

  // continuous day count in the viewer's local time — no yearly reset
  function localDayNumber() {
    var now = new Date();
    var ms = now.getTime() - now.getTimezoneOffset() * 60000;
    return Math.floor(ms / 86400000);
  }

  var dailyIndex = ((localDayNumber() % QUOTES.length) + QUOTES.length) % QUOTES.length;
  var current = dailyIndex;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function paintMeta() {
    var d = new Date();
    dateEl.textContent = d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    var marker = current === dailyIndex ? "" : "· ";
    indexEl.textContent = marker + "№ " + pad(current + 1) + " / " + QUOTES.length;
  }

  function setContent(i) {
    var q = QUOTES[i];
    qEl.textContent = q.t;
    aEl.textContent = q.a;
    paintMeta();
  }

  function reveal() {
    qEl.classList.remove("out");
    aEl.classList.remove("out");
    void qEl.offsetWidth; // force reflow so the transition re-triggers
    qEl.classList.add("in");
    aEl.classList.add("in");
  }

  function swapTo(i) {
    current = i;
    qEl.classList.remove("in");
    aEl.classList.remove("in");
    qEl.classList.add("out");
    aEl.classList.add("out");
    window.setTimeout(function () {
      setContent(i);
      reveal();
    }, 170);
  }

  btn.addEventListener("click", function () {
    if (QUOTES.length < 2) return;
    var next = current;
    while (next === current) {
      next = Math.floor(Math.random() * QUOTES.length);
    }
    swapTo(next);
  });

  // first paint
  setContent(dailyIndex);
  requestAnimationFrame(reveal);

  // if the widget is left open across midnight, roll to the new day's quote
  window.setInterval(function () {
    var fresh = ((localDayNumber() % QUOTES.length) + QUOTES.length) % QUOTES.length;
    if (fresh !== dailyIndex) {
      dailyIndex = fresh;
      swapTo(fresh);
    }
  }, 60000);
</script>
</body>
</html>
